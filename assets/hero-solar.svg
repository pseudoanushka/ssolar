<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb703;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb8500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#023047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#126782;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Animated Sun -->
  <g id="sun" filter="url(#glow)">
    <circle cx="450" cy="150" r="60" fill="url(#sunGradient)" opacity="0.9">
      <animate attributeName="r" values="60;65;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Sun rays -->
    <g opacity="0.7">
      <line x1="450" y1="70" x2="450" y2="40" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y2" values="40;35;40" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="505" y1="95" x2="525" y2="75" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="525;530;525" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="75;70;75" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="530" y1="150" x2="560" y2="150" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="560;565;560" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="505" y1="205" x2="525" y2="225" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="525;530;525" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="225;230;225" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="450" y1="230" x2="450" y2="260" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y2" values="260;265;260" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="395" y1="205" x2="375" y2="225" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="375;370;375" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="225;230;225" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="370" y1="150" x2="340" y2="150" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="340;335;340" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="395" y1="95" x2="375" y2="75" stroke="#ffb703" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="375;370;375" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="75;70;75" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Energy waves -->
  <g opacity="0.3">
    <path d="M 100 300 Q 200 250, 300 300 T 500 300" stroke="#ffb703" stroke-width="2" fill="none">
      <animate attributeName="d"
        values="M 100 300 Q 200 250, 300 300 T 500 300;
                M 100 300 Q 200 280, 300 300 T 500 300;
                M 100 300 Q 200 250, 300 300 T 500 300"
        dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 320 Q 200 270, 300 320 T 500 320" stroke="#00d4ff" stroke-width="2" fill="none">
      <animate attributeName="d"
        values="M 100 320 Q 200 270, 300 320 T 500 320;
                M 100 320 Q 200 300, 300 320 T 500 320;
                M 100 320 Q 200 270, 300 320 T 500 320"
        dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </path>
  </g>

  <!-- Solar Panel Array -->
  <g id="solarPanels">
    <!-- Panel 1 -->
    <g transform="translate(80, 350)">
      <rect width="140" height="180" fill="url(#panelGradient)" rx="5"/>
      <g stroke="#00d4ff" stroke-width="2" opacity="0.6">
        <line x1="70" y1="0" x2="70" y2="180"/>
        <line x1="0" y1="45" x2="140" y2="45"/>
        <line x1="0" y1="90" x2="140" y2="90"/>
        <line x1="0" y1="135" x2="140" y2="135"/>
      </g>
      <circle cx="15" cy="165" r="3" fill="#ffb703" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Panel 2 -->
    <g transform="translate(240, 340)">
      <rect width="140" height="180" fill="url(#panelGradient)" rx="5"/>
      <g stroke="#00d4ff" stroke-width="2" opacity="0.6">
        <line x1="70" y1="0" x2="70" y2="180"/>
        <line x1="0" y1="45" x2="140" y2="45"/>
        <line x1="0" y1="90" x2="140" y2="90"/>
        <line x1="0" y1="135" x2="140" y2="135"/>
      </g>
      <circle cx="15" cy="165" r="3" fill="#ffb703" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
    </g>

    <!-- Panel 3 -->
    <g transform="translate(400, 330)">
      <rect width="140" height="180" fill="url(#panelGradient)" rx="5"/>
      <g stroke="#00d4ff" stroke-width="2" opacity="0.6">
        <line x1="70" y1="0" x2="70" y2="180"/>
        <line x1="0" y1="45" x2="140" y2="45"/>
        <line x1="0" y1="90" x2="140" y2="90"/>
        <line x1="0" y1="135" x2="140" y2="135"/>
      </g>
      <circle cx="15" cy="165" r="3" fill="#ffb703" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>
  </g>

  <!-- House silhouette -->
  <g id="house" opacity="0.4">
    <path d="M 50 450 L 200 350 L 350 450 Z" fill="#132f4c"/>
    <rect x="50" y="450" width="300" height="150" fill="#0a1929"/>
    <rect x="90" y="480" width="60" height="80" fill="#c17f3f" opacity="0.5"/>
    <rect x="250" y="480" width="60" height="80" fill="#c17f3f" opacity="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="20" fill="#c17f3f" opacity="0.1"/>
  <circle cx="550" cy="550" r="30" fill="#00d4ff" opacity="0.1"/>
  <circle cx="100" cy="200" r="15" fill="#ffb703" opacity="0.1"/>

  <!-- Energy particles -->
  <g id="particles">
    <circle cx="200" cy="280" r="3" fill="#ffb703" opacity="0.7">
      <animate attributeName="cy" values="280;260;280" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="290" r="2" fill="#00d4ff" opacity="0.7">
      <animate attributeName="cy" values="290;270;290" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="285" r="2.5" fill="#ffb703" opacity="0.7">
      <animate attributeName="cy" values="285;265;285" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
